<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creas — Dashboard Seguimiento Proyectos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';document.head.appendChild(s);"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; }
.header { background: #fff; border-bottom: 1px solid #e8e8e5; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.logo { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.logo span { color: #5a7a3a; }
.header-title { font-size: 12px; color: #aaa; margin-left: 12px; }
.header-left { display: flex; align-items: center; }
.header-right { display: flex; align-items: center; gap: 10px; }
.last-update { font-size: 11px; color: #bbb; }
.refresh-btn { font-size: 12px; padding: 6px 14px; border-radius: 6px; border: 1px solid #ddd; background: #fff; color: #444; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.refresh-btn:hover { background: #f5f5f3; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #5a7a3a; display: inline-block; }
.dot.loading { background: #e8a020; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
.main { padding: 22px 28px; max-width: 1200px; margin: 0 auto; }
.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
.metric { background: #fff; border: 1px solid #e8e8e5; border-radius: 10px; padding: 14px 16px; }
.metric-label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
.metric-value { font-size: 26px; font-weight: 600; line-height: 1; }
.metric-sub { font-size: 11px; color: #bbb; margin-top: 3px; }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.panel { background: #fff; border: 1px solid #e8e8e5; border-radius: 10px; padding: 16px 18px; }
.panel-title { font-size: 13px; font-weight: 500; margin-bottom: 12px; }
.carga-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.carga-name { font-size: 12px; font-weight: 600; color: #555; width: 24px; }
.carga-track { flex: 1; background: #f0f0ee; border-radius: 4px; height: 11px; overflow: hidden; }
.carga-fill { height: 100%; border-radius: 4px; }
.carga-num { font-size: 11px; color: #555; width: 20px; text-align: right; font-weight: 500; }
.carga-avg { font-size: 10px; color: #bbb; width: 38px; text-align: right; }
.chart-wrap { position: relative; width: 100%; height: 165px; }
.panel-full { background: #fff; border: 1px solid #e8e8e5; border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.filter-btn { font-size: 11px; padding: 4px 11px; border-radius: 20px; border: 1px solid #ddd; background: #fff; color: #666; cursor: pointer; }
.filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.proj-section { margin-bottom: 4px; }
.proj-section-header { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #aaa; padding: 10px 0 6px; border-bottom: 1px solid #f0f0ee; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
.sect-pill { display: inline-block; font-size: 9px; font-weight: 600; padding: 1px 7px; border-radius: 3px; letter-spacing: 0.04em; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 11px; color: #aaa; font-weight: 500; padding: 0 8px 8px 0; text-align: left; border-bottom: 1px solid #f0f0ee; }
td { font-size: 12px; padding: 7px 8px 7px 0; border-bottom: 1px solid #f8f8f7; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.col-n { width: 22%; font-weight: 500; }
.col-e { width: 15%; }
.col-d { width: 43%; color: #888; font-size: 11px; line-height: 1.4; }
.col-t { width: 20%; }
.badge { display: inline-block; font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.b-im { background: #dbeafe; color: #1e40af; }
.b-teaser { background: #ede9fe; color: #5b21b6; }
.b-pre { background: #f3f4f6; color: #374151; }
.b-dd { background: #fee2e2; color: #991b1b; }
.b-seg { background: #fce7f3; color: #9d174d; }
.b-other { background: #f9fafb; color: #6b7280; }
.tdot { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; font-size: 8px; font-weight: 700; margin-right: 2px; }
.heat-table th, .heat-table td { text-align: center; }
.heat-table td:first-child { text-align: left; font-weight: 600; }
.h0 { color: #ccc; }
.h1 { color: #3b6d11; font-weight: 500; }
.h2 { color: #92400e; font-weight: 500; }
.h3 { color: #991b1b; font-weight: 600; }
.loading-overlay { display: flex; align-items: center; justify-content: center; min-height: 300px; flex-direction: column; gap: 12px; color: #aaa; font-size: 13px; }
.spinner { width: 24px; height: 24px; border: 2px solid #e8e8e5; border-top-color: #5a7a3a; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.auth-box { background: #fff; border: 1px solid #e8e8e5; border-radius: 10px; padding: 36px; text-align: center; max-width: 420px; margin: 60px auto; }
.auth-box h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.auth-box p { font-size: 13px; color: #888; margin-bottom: 22px; line-height: 1.6; }
.auth-btn { display: inline-block; background: #0078d4; color: #fff; font-size: 13px; font-weight: 500; padding: 10px 24px; border-radius: 6px; border: none; cursor: pointer; }
.auth-btn:hover { background: #106ebe; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">Creas <span>●</span></div>
    <div class="header-title">Dashboard · Seguimiento de proyectos</div>
  </div>
  <div class="header-right">
    <span class="last-update" id="last-update">—</span>
    <button class="refresh-btn" onclick="loadData()">
      <span class="dot" id="status-dot"></span> Actualizar
    </button>
  </div>
</div>

<div class="main" id="main-content">
  <div class="loading-overlay"><div class="spinner"></div><span>Cargando...</span></div>
</div>

<script>
const DRIVE_ID = 'b!UuIMk9bqMU6Pc4GVekEIN_vIOsN4CsVPlHusnUaQs6fZEhmDfmfvQb8g14wGxNVt';
const ITEM_ID  = '01DBISMGAQLCLNCHDDNZAIPTUPWMZ2OXWJ';
const CLIENT_ID = 'aa268ac0-8d49-4e4b-916a-4f3619404ec6';
const TENANT_ID = 'f03276f2-70bd-4ce6-b9f9-f2bf22991827';
const SCOPE = 'https://graph.microsoft.com/Files.Read.All';
const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];

let accessToken = null;
let evoChart = null;
let currentCat = 'Todos';
let selectedMember = null;
let _allProjects = [];

// ── Auth ──────────────────────────────────────────────────────────────────
function getTokenFromHash() {
  const params = new URLSearchParams(window.location.hash.substring(1));
  const t = params.get('access_token');
  if (t) { accessToken = t; window.history.replaceState({}, '', window.location.pathname); return true; }
  return false;
}
function login() {
  window.location.href = `https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/authorize`
    + `?client_id=${CLIENT_ID}&response_type=token`
    + `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`
    + `&scope=${encodeURIComponent(SCOPE)}&response_mode=fragment`;
}

// ── Graph fetch ───────────────────────────────────────────────────────────
async function fetchSheetData() {
  const wsRes = await fetch(
    `https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${ITEM_ID}/workbook/worksheets`,
    { headers: { Authorization: `Bearer ${accessToken}` } }
  );
  if (!wsRes.ok) throw new Error('Graph ' + wsRes.status);
  const ws = await wsRes.json();
  const sheet = (ws.value.find(s => /balance|carga/i.test(s.name)) || ws.value[0]).name;
  const rRes = await fetch(
    `https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${ITEM_ID}/workbook/worksheets('${encodeURIComponent(sheet)}')/usedRange`,
    { headers: { Authorization: `Bearer ${accessToken}` } }
  );
  if (!rRes.ok) throw new Error('Range ' + rRes.status);
  return (await rRes.json()).values;
}

// ── Parse ─────────────────────────────────────────────────────────────────
function parseData(rows) {
  // Hardcoded from verified Excel read — overridden live when Graph works
  return STATIC_DATA;
}

// ── Render ────────────────────────────────────────────────────────────────
// Equipo: se rellena desde la cabecera del Excel (columnas entre "Peso" y "Fecha inicio"); este valor es el fallback
const TEAM = ['LV','OM','LG','CL','HS','IH','CV','CLe','ME'];
const teamColors = { LV:'#2563eb',OM:'#059669',LG:'#7c3aed',CL:'#dc2626',HS:'#d97706',IH:'#e11d48',CV:'#16a34a',CLe:'#0891b2',ME:'#6b7280' };
const EXTRA_COLORS = ['#0d9488','#9333ea','#ea580c','#4f46e5','#be185d','#65a30d'];
function registerTeam(names) {
  TEAM.splice(0, TEAM.length, ...names);
  names.forEach(n => { if (!teamColors[n]) teamColors[n] = EXTRA_COLORS[Object.keys(teamColors).length % EXTRA_COLORS.length]; });
}

function badgeClass(e) {
  return {IM:'b-im',Teaser:'b-teaser','Pre-Teaser':'b-pre','Due Diligence':'b-dd',Seguimiento:'b-seg'}[e] || 'b-other';
}

// Section display config
const SECT_CONFIG = {
  'Rituales':     { color:'#ede9fe', text:'#5b21b6', parent:'Rituales' },
  'Empoderar':    { color:'#dbeafe', text:'#1e40af', parent:'Inversión' },
  'Cuidar':       { color:'#fce7f3', text:'#9d174d', parent:'Inversión' },
  'Regenerar':    { color:'#d1fae5', text:'#065f46', parent:'Inversión' },
  'Cartera':      { color:'#fef3c7', text:'#92400e', parent:'Cartera' },
  'Originación':  { color:'#f3f4f6', text:'#374151', parent:'Transversal' },
  'Com. & Eventos':{ color:'#f3f4f6', text:'#374151', parent:'Transversal' },
  'Impacto':      { color:'#f3f4f6', text:'#374151', parent:'Transversal' },
  'People':       { color:'#f3f4f6', text:'#374151', parent:'Transversal' },
  'Interno':      { color:'#f3f4f6', text:'#374151', parent:'Transversal' },
  'Growth Gestora':{ color:'#f3f4f6', text:'#374151', parent:'Transversal' },
  'Rel. Inversores':{ color:'#f3f4f6', text:'#374151', parent:'Transversal' },
};

function renderDashboard(data) {
  const { projects, cargaRows, weeklyTotal, weekLabels } = data;
  _allProjects = projects;
  const maxC = Math.max(...cargaRows.map(r => r.weeks[0]), 1);
  const total = cargaRows.reduce((a,b) => a + b.weeks[0], 0);
  const maxP = cargaRows.reduce((a,b) => b.weeks[0]>a.weeks[0]?b:a, cargaRows[0]);
  const avg3 = Math.round(cargaRows.reduce((a,b) => a+b.avg3, 0) / cargaRows.length);

  document.getElementById('main-content').innerHTML = `
    <div class="metrics">
      <div class="metric"><div class="metric-label">Proyectos activos</div><div class="metric-value">${projects.filter(p => p.section !== 'Rituales').length}</div><div class="metric-sub">en todas las categorías</div></div>
      <div class="metric"><div class="metric-label">Carga total equipo</div><div class="metric-value">${total}</div><div class="metric-sub">semana actual</div></div>
      <div class="metric"><div class="metric-label">Más cargado</div><div class="metric-value">${maxP.name}</div><div class="metric-sub">${maxP.weeks[0]} pts esta semana</div></div>
      <div class="metric"><div class="metric-label">Promedio equipo 3s</div><div class="metric-value">${avg3}</div><div class="metric-sub">por colaborador</div></div>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-title">Carga semanal por colaborador</div>
        ${cargaRows.map((d,i) => `
          <div class="carga-row">
            <span class="carga-name">${d.name}</span>
            <div class="carga-track"><div class="carga-fill" style="width:${Math.round(d.weeks[0]/maxC*100)}%;background:${teamColors[d.name]||'#6b7280'};"></div></div>
            <span class="carga-num">${d.weeks[0]}</span>
            <span class="carga-avg">avg ${d.avg3}</span>
          </div>`).join('')}
      </div>
      <div class="panel">
        <div class="panel-title">Evolución carga total equipo</div>
        <div class="chart-wrap"><canvas id="evoChart" role="img" aria-label="Carga total del equipo por semana"></canvas></div>
      </div>
    </div>

    <div class="panel-full">
      <div class="panel-title">Proyectos activos</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;">
        <div class="filter-row" id="cat-filters">
          ${['Todos','Rituales','Inversión','Cartera','Transversal'].map(c =>
            `<button class="filter-btn${currentCat===c?' active':''}" onclick="setCat('${c}')">${c}</button>`
          ).join('')}
        </div>
        <div class="filter-row" id="member-filters">
          <span style="font-size:11px;color:#bbb;line-height:26px;margin-right:2px;">Persona</span>
          ${TEAM.map(m =>
            `<button class="filter-btn member-btn" data-member="${m}" onclick="toggleMember('${m}')" style="display:flex;align-items:center;gap:5px;">
              <span style="width:8px;height:8px;border-radius:50%;background:${teamColors[m]};display:inline-block;"></span>${m}
            </button>`
          ).join('')}
        </div>
      </div>
      <div id="proj-list"></div>
    </div>

    <div class="panel-full">
      <div class="panel-title">Carga detallada por semana</div>
      <table class="heat-table">
        <thead><tr>
          <th style="text-align:left">Colaborador</th>
          ${weekLabels.map(l=>`<th>${l}</th>`).join('')}
          <th>Avg 3s</th><th>Avg 9s</th>
        </tr></thead>
        <tbody>${cargaRows.map(d=>`<tr>
          <td>${d.name}</td>
          ${d.weeks.map(v=>`<td class="${v===0?'h0':v<=6?'h1':v<=12?'h2':'h3'}">${v}</td>`).join('')}
          <td style="font-weight:600">${d.avg3}</td>
          <td style="color:#aaa">${d.avg9}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`;

  drawEvoChart(weekLabels, weeklyTotal);

  renderProjects();
}

function drawEvoChart(weekLabels, weeklyTotal, attempt = 0) {
  // Esperar a que Chart.js (CDN) esté cargado; reintentar hasta ~3s
  if (typeof Chart === 'undefined') {
    if (attempt < 30) { setTimeout(() => drawEvoChart(weekLabels, weeklyTotal, attempt + 1), 100); return; }
    console.error('Chart.js no se ha cargado (¿bloqueo del CDN?).');
    const wrap = document.querySelector('.chart-wrap');
    if (wrap) wrap.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#bbb;font-size:12px;text-align:center;">No se pudo cargar la librería de gráficas.<br>Revisa la conexión o el bloqueo del CDN.</div>';
    return;
  }
  const canvas = document.getElementById('evoChart');
  if (!canvas) return;
  // Esperar a que el layout dé tamaño al contenedor antes de dibujar
  requestAnimationFrame(() => {
    try {
      if (evoChart) { evoChart.destroy(); evoChart = null; }
      evoChart = new Chart(canvas, {
        type: 'line',
        data: { labels: weekLabels, datasets: [{ label:'Carga total', data: weeklyTotal,
          borderColor:'#5a7a3a', backgroundColor:'rgba(90,122,58,0.08)',
          fill:true, tension:0.3, pointRadius:4, pointBackgroundColor:'#5a7a3a' }] },
        options: { responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ display:false } },
          scales:{ y:{ beginAtZero:true, grid:{ color:'rgba(0,0,0,0.05)' }, ticks:{ font:{size:11} } },
                   x:{ grid:{ display:false }, ticks:{ font:{size:11} } } } }
      });
    } catch (err) {
      console.error('Error al crear la gráfica de evolución:', err);
    }
  });
}

function renderProjects() {
  const catMap = { 'Rituales':['Rituales'], 'Inversión':['Empoderar','Cuidar','Regenerar'], 'Cartera':['Cartera'],
    'Transversal':['Originación','Com. & Eventos','Impacto','People','Interno','Growth Gestora','Rel. Inversores'] };

  const sectionsToShow = currentCat === 'Todos'
    ? Object.values(catMap).flat()
    : catMap[currentCat] || [];

  let html = '';
  let totalShown = 0;
  for (const sect of sectionsToShow) {
    let projs = _allProjects.filter(p => p.section === sect);
    if (selectedMember) projs = projs.filter(p => p.equipo.includes(selectedMember));
    if (!projs.length) continue;
    totalShown += projs.length;
    const cfg = SECT_CONFIG[sect] || { color:'#f3f4f6', text:'#374151' };
    html += `<div class="proj-section">
      <div class="proj-section-header">
        <span class="sect-pill" style="background:${cfg.color};color:${cfg.text}">${sect}</span>
        <span style="color:#ccc">${projs.length} proyecto${projs.length>1?'s':''}</span>
      </div>
      <table><tbody>
        ${projs.map(p => `<tr>
          <td class="col-n">${p.name}</td>
          <td class="col-e">${p.etapa ? `<span class="badge ${badgeClass(p.etapa)}">${p.etapa}</span>` : ''}</td>
          <td class="col-d">${p.desc.length>70?p.desc.slice(0,70)+'…':p.desc}</td>
          <td class="col-t">${p.equipo.map(m=>{
            const active = !selectedMember || m===selectedMember;
            return `<span class="tdot" style="background:${active?teamColors[m]+'22':'#f0f0ee'};color:${active?teamColors[m]:'#ccc'};${m===selectedMember?'outline:2px solid '+teamColors[m]+';outline-offset:1px;':''}">${m}</span>`;
          }).join('')}</td>
        </tr>`).join('')}
      </tbody></table>
    </div>`;
  }
  if (!totalShown) html = `<div style="padding:24px 0;text-align:center;color:#bbb;font-size:13px;">Sin proyectos para este filtro</div>`;
  document.getElementById('proj-list').innerHTML = html;
}

window.setCat = function(cat) {
  currentCat = cat;
  document.querySelectorAll('#cat-filters .filter-btn').forEach(b => b.classList.toggle('active', b.textContent.trim()===cat));
  renderProjects();
};

window.toggleMember = function(m) {
  selectedMember = selectedMember === m ? null : m;
  document.querySelectorAll('.member-btn').forEach(b => {
    const active = b.dataset.member === selectedMember;
    b.classList.toggle('active', active);
    if (active) b.style.borderColor = teamColors[m];
    else b.style.borderColor = '';
  });
  renderProjects();
};

// ── Load ──────────────────────────────────────────────────────────────────
async function loadData() {
  document.getElementById('status-dot').className = 'dot loading';
  if (!accessToken) { showAuth(); return; }
  try {
    const rows = await fetchSheetData();
    const data = parseLiveData(rows);
    renderDashboard(data);
    document.getElementById('last-update').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    if (/401|403/.test(e.message)) { accessToken=null; showAuth(); }
    else { renderDashboard(STATIC_DATA); document.getElementById('last-update').textContent = 'Error Graph · datos locales'; }
  }
  document.getElementById('status-dot').className = 'dot';
}

function showAuth() {
  document.getElementById('main-content').innerHTML = `
    <div class="auth-box">
      <h2>Acceso con cuenta Creas</h2>
      <p>El dashboard lee el Excel en tiempo real desde SharePoint. Inicia sesión con tu cuenta de Microsoft para continuar.</p>
      <button class="auth-btn" onclick="login()">Iniciar sesión con Microsoft</button>
    </div>`;
  document.getElementById('status-dot').className = 'dot';
}

// ── Live parser (Graph data) ───────────────────────────────────────────────
function parseLiveData(rows) {
  // Section markers in order as they appear in Excel
  const SECT_MAP = [
    { marker:'Rituales',            section:'Rituales' },
    { marker:'Empoderar',           section:'Empoderar' },
    { marker:'Cuidar',              section:'Cuidar' },
    { marker:'Regenerar',           section:'Regenerar' },
    { marker:'CARTERA',             section:'Cartera' },
    { marker:'ORIGINACIÓN',         section:'Originación' },
    { marker:'COMUNICACIÓN',        section:'Com. & Eventos' },
    { marker:'IMPACTO',             section:'Impacto' },
    { marker:'PEOPLE',              section:'People' },
    { marker:'INTERNO',             section:'Interno' },
    { marker:'GROWTH',              section:'Growth Gestora' },
    { marker:'RELACIÓN',            section:'Rel. Inversores' },
  ];
  let currentSection = '';
  const projects = [];
  let headerFound = false;
  let col = null; // offsets reales detectados desde la fila de cabecera

  for (const row of rows) {
    // Detectar fila de cabecera y mapear columnas por su nombre
    if (!headerFound) {
      const hi = row.findIndex(c => String(c||'').trim() === 'Proyecto');
      if (hi !== -1) {
        const find = label => row.findIndex(c => String(c||'').trim() === label);
        col = {
          name: hi,
          desc: find('Descripción / Tarea'),
          estado: find('Estado'),
          etapa: find('Etapa actual'),
          team: {}
        };
        // Equipo = columnas entre "Peso" y "Fecha inicio"
        const pi = find('Peso'), fi = find('Fecha inicio');
        const names = [];
        for (let j = pi + 1; j < fi; j++) { const n = String(row[j]||'').trim(); if (n) { names.push(n); col.team[n] = j; } }
        if (names.length) registerTeam(names);
        headerFound = true;
      }
      continue;
    }
    const r0 = String(row[col.name]||'').trim();
    const sect = SECT_MAP.find(s => r0.startsWith(s.marker));
    if (sect) { currentSection = sect.section; continue; }
    if (String(row[col.estado]||'') === 'Activo' && (row[col.etapa] || currentSection === 'Rituales')) {
      const equipo = [];
      for (const [name,ci] of Object.entries(col.team)) if (ci!==-1 && row[ci] && row[ci]!=0) equipo.push(name);
      let desc = String(row[col.desc]||'').trim();
      if (desc === 'n.a.') desc = '';
      projects.push({ name:r0, desc, estado:'Activo', etapa:String(row[col.etapa]||''), section:currentSection, equipo });
    }
  }

  // Parse carga — busca las filas de colaboradores directamente (robusto ante
  // fechas que Graph puede devolver como texto en lugar de número serie)
  let cargaRows = [], weeklyTotal = [], weekLabels = [];
  const collabs = TEAM;
  const canon = v => TEAM.find(t => t.toLowerCase() === v.toLowerCase()) || v; // "Cle" en la tabla de carga = "CLe" en la cabecera
  // El nombre del colaborador puede estar en col 1, 2 o 3 según el offset del rango
  const nameOf = r => {
    for (const idx of [3,2,1,0]) {
      const v = canon(String(r[idx]||'').trim());
      if (collabs.includes(v) || v.toLowerCase().includes('total')) return { v, idx };
    }
    return { v:'', idx:-1 };
  };
  for (let i=0; i<rows.length; i++) {
    const { v:nm, idx:nameIdx } = nameOf(rows[i]);
    if (!collabs.includes(nm)) continue;
    // Las 9 columnas de semanas empiezan justo después de la columna del nombre
    const start = nameIdx + 1;
    const w = [];
    for (let j=start; j<start+9; j++) w.push(Number(rows[i][j])||0);
    const a3 = w.slice(0,3).reduce((a,b)=>a+b,0)/3;
    const a9 = w.reduce((a,b)=>a+b,0)/w.length;
    cargaRows.push({ name:nm, weeks:w, avg3:Math.round(a3), avg9:parseFloat(a9.toFixed(1)) });
  }
  // Fila Total equipo
  for (const r of rows) {
    const { v, idx } = nameOf(r);
    if (v.toLowerCase().includes('total')) {
      const start = idx + 1;
      for (let j=start; j<start+9; j++) weeklyTotal.push(Number(r[j])||0);
      break;
    }
  }
  weekLabels = (cargaRows[0]?.weeks || []).map((_,idx)=>`S${idx+1}`);
  // Si no se detectó la fila Total, sumar las cargas de los colaboradores
  if (!weeklyTotal.length && cargaRows.length) {
    weeklyTotal = cargaRows[0].weeks.map((_,j)=>cargaRows.reduce((a,r)=>a+(r.weeks[j]||0),0));
  }
  if (!cargaRows.length) return STATIC_DATA;
  return { projects: projects.length ? projects : STATIC_DATA.projects, cargaRows, weeklyTotal, weekLabels };
}
